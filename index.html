<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="우리의 하루"><link rel="manifest" href="manifest.json"><title>우리의 하루</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:linear-gradient(#fff8fa,#fff);color:#4b3b42}.wrap{max-width:480px;margin:auto;min-height:100vh;padding:24px 18px 100px}.card{background:#fff;border:1px solid #f1dfe5;border-radius:24px;padding:20px;box-shadow:0 12px 30px #c46c8717}.logo{width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,#ff9db5,#ffd0dc);display:grid;place-items:center;font-size:42px;margin:80px auto 18px}.center{text-align:center}.btn{width:100%;padding:15px;border:1px solid #eadde2;border-radius:16px;background:#fff;margin-top:10px;font-weight:700}.dark{background:#40343a;color:#fff}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.pink{color:#e76b8d}.hero{margin-top:18px;background:linear-gradient(135deg,#fff,#ffeef3);border-radius:24px;padding:20px}.dplus{font-size:34px;font-weight:800;color:#e76b8d;margin-top:14px}.section{margin-top:22px}.memory{background:#fff;border:1px solid #f1dfe5;border-radius:20px;padding:14px;margin-top:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;justify-content:space-around;background:#fffdfddd;border-top:1px solid #f0dfe5;padding:12px 0 calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{border:0;background:none;color:#9b8990}.fab{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:5px solid white;background:#ff7f9e;color:#fff;font-size:30px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{aspect-ratio:1;border:0;border-radius:12px;background:#fff}.sel{background:#ffedf2}.modal{position:fixed;inset:0;background:#0004;display:none;align-items:flex-end}.sheet{background:#fff;border-radius:28px 28px 0 0;padding:20px;width:100%;max-width:480px;margin:auto}.sheet input,.sheet textarea{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px;border:1px solid #eadde2;border-radius:12px}.sheet textarea{min-height:110px}</style></head><body><main class="wrap"><section id="login"><div class="logo">♡</div><div class="center"><h1>우리의 하루</h1><p>둘만의 추억을 차곡차곡 기록해요.</p><button class="btn dark" onclick="login()"> Apple로 계속하기</button><button class="btn" onclick="login()">G Google로 계속하기</button><small>설치 테스트용 데모 로그인</small></div></section><section id="space" class="hidden"><div class="logo">♡</div><div class="center"><h2>우리 공간</h2><p>둘만의 공간을 만들거나 초대코드로 참여해요.</p><button class="btn dark" onclick="createSpace()">우리 공간 만들기</button><button class="btn" onclick="joinSpace()">초대받았어요</button></div></section><section id="app" class="hidden"><div class="top"><div class="brand">우리의 하루 <span class="pink">♡</span></div><button class="btn" style="width:auto;margin:0" onclick="invite()">초대</button></div><div class="hero"><h2>오늘도 함께라서 행복해요 ♡</h2><p>둘만의 소중한 순간을 남겨보세요.</p><div class="dplus">D+ 1</div></div><div class="section"><h3>캘린더</h3><div id="calendar" class="calendar"></div></div><div class="section"><h3>최근 기록</h3><div id="records"></div></div><button class="fab" onclick="openEditor()">+</button><nav class="nav"><button>홈</button><button>캘린더</button><button>기록</button><button>추억</button></nav></section></main><div id="editor" class="modal" onclick="if(event.target===this)this.style.display='none'"><div class="sheet"><h3>새로운 기록 ♡</h3><input id="date" type="date"><input id="title" placeholder="제목"><textarea id="text" placeholder="오늘의 기록"></textarea><input id="location" placeholder="장소"><input id="mood" placeholder="기분 😊"><input id="photo" type="file" accept="image/*" multiple><button class="btn dark" onclick="saveRecord()">저장하기</button></div></div><script>let records=JSON.parse(localStorage.getItem('ourday_records')||'[]');let selected=new Date();function login(){document.querySelector('#login').classList.add('hidden');document.querySelector('#space').classList.remove('hidden')}function createSpace(){localStorage.setItem('ourday_space','demo');start()}function joinSpace(){const c=prompt('초대 코드를 입력해 주세요');if(c){localStorage.setItem('ourday_space',c);start()}}function start(){document.querySelector('#login').classList.add('hidden');document.querySelector('#space').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');render()}function render(){renderCalendar();document.querySelector('#records').innerHTML=records.length?records.map(r=>`<div class="memory"><b>${r.title}</b><div>${r.date} · ${r.mood||'♡'}</div><p>${r.text||''}</p>${r.location?'<small>📍 '+r.location+'</small>':''}</div>`).join(''):'<div class="memory">첫 기록을 남겨보세요 ♡</div>'}function renderCalendar(){const box=document.querySelector('#calendar');box.innerHTML='';const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)box.append(document.createElement('div'));for(let d=1;d<=last;d++){const b=document.createElement('button');b.className='day';b.textContent=d;b.onclick=()=>{selected=new Date(y,m,d);document.querySelector('#date').value=selected.toISOString().slice(0,10);openEditor()};box.append(b)}}function openEditor(){document.querySelector('#editor').style.display='flex';if(!document.querySelector('#date').value)document.querySelector('#date').value=new Date().toISOString().slice(0,10)}function saveRecord(){records.unshift({date:date.value,title:title.value||'우리의 하루',text:text.value,location:location.value,mood:mood.value});localStorage.setItem('ourday_records',JSON.stringify(records));document.querySelector('#editor').style.display='none';render()}function invite(){const code='LOVE24';const url=location.href.split('?')[0]+'?invite='+code;navigator.clipboard?.writeText(url);alert('초대 링크를 복사했어요\n'+url)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');if(localStorage.getItem('ourday_space'))start();</script></body></html>
